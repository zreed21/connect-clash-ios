<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0614" />
  <title>Pairstorm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0a0614; }
    body {
      font-family: "Arial Black", Impact, ui-sans-serif, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 0%, #1d1136 0%, #0a0614 55%, #05030b 100%);
      color: #fff;
    }
    .loader {
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }
    .reed {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: clamp(2rem, 10vw, 3.5rem);
      letter-spacing: 0.18em;
      font-weight: 900;
      background: linear-gradient(95deg, #fbbf24, #fb923c 45%, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .gaming {
      margin-top: 0.25rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(0.75rem, 3vw, 0.95rem);
      letter-spacing: 0.45em;
      color: rgba(255,255,255,0.5);
      font-weight: 700;
    }
    .bar {
      margin: 1.5rem auto 0;
      width: 120px; height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #fbbf24, #a78bfa);
      animation: load 1.8s ease-in-out forwards;
    }
    @keyframes load { to { width: 100%; } }
    @keyframes pulse { 0%,100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.98); } }
    .out { animation: fadeOut 0.5s ease forwards; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="reed">REED</div>
    <div class="reed" style="margin-top:-0.15em">GAMING</div>
    <div class="gaming">PRESENTS</div>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
  <script>
    setTimeout(function() {
      var l = document.getElementById('loader');
      if (l) l.classList.add('out');
    }, 1500);
    setTimeout(function() {
      location.href = 'game.html';
    }, 2000);
  </script>
</body>
</html>
