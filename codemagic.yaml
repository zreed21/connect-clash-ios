# Codemagic CI — iOS archive + TestFlight for Connect Clash
#
# Auth: App Store Connect API key via env group `appstore_credentials`
# (do NOT rely on a Codemagic ASC "integration" unless you create one separately).
#
# Create these encrypted variables in Codemagic → Teams → Environment variables
# (group name must be exactly: appstore_credentials):
#
#   APP_STORE_CONNECT_ISSUER_ID        Issuer ID from ASC → Users and Access → Integrations → App Store Connect API
#   APP_STORE_CONNECT_KEY_IDENTIFIER   Key ID for your .p8 key
#   APP_STORE_CONNECT_PRIVATE_KEY      Full contents of AuthKey_XXXXXX.p8 (including BEGIN/END lines)
#   CERTIFICATE_PRIVATE_KEY            RSA key for Codemagic-managed distribution cert
#                                        openssl genrsa 2048 | pbcopy   (or openssl genrsa -out cert_key 2048)
#
# Also set (same group or workflow vars):
#   APPLE_TEAM_ID                      10-char Team ID
#   APP_STORE_APPLE_ID                 Numeric Apple ID of the ASC app (App Information)
#
# Bundle ID: com.connectclash.app

workflows:
  ios-testflight:
    name: Pairstorm iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.connectclash.app"
        # Override these in the Codemagic UI (env group) once the ASC app exists:
        # APP_STORE_APPLE_ID / APPLE_TEAM_ID
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify App Store Connect API env
        script: |
          set -e
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v — add it to Codemagic env group 'appstore_credentials'"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          echo "ASC API env present (values not printed)."
      - name: Ensure ASC display name is "Pairstorm" (best effort)
        script: |
          node - <<'NODE' || echo "ASC name fix skipped (non-fatal)"
          const crypto = require('crypto');
          const iss = process.env.APP_STORE_CONNECT_ISSUER_ID;
          const kid = process.env.APP_STORE_CONNECT_KEY_IDENTIFIER;
          const key = process.env.APP_STORE_CONNECT_PRIVATE_KEY;
          const appId = process.env.APP_STORE_APPLE_ID || '6814711059';
          if (!iss || !kid || !key) { console.log('no ASC creds, skip'); process.exit(0); }
          const b64u = b => Buffer.from(b).toString('base64url');
          const iat = Math.floor(Date.now() / 1000);
          const header = b64u(JSON.stringify({alg: 'ES256', kid, typ: 'JWT'}));
          const payload = b64u(JSON.stringify({iss, iat, exp: iat + 1000,
            aud: 'appstoreconnect-v1', bid: 'com.connectclash.app'}));
          const data = header + '.' + payload;
          const sig = crypto.sign(null, Buffer.from(data),
            {key, dsaEncoding: 'ieee-p1363'}).toString('base64url');
          const H = {Authorization: 'Bearer ' + data + '.' + sig,
            'Content-Type': 'application/json'};
          const API = 'https://api.appstoreconnect.apple.com/v1';
          (async () => {
            const infos = await (await fetch(`${API}/apps/${appId}/appInfos`, {headers: H})).json();
            for (const info of (infos.data || [])) {
              const locs = await (await fetch(`${API}/appInfos/${info.id}/appInfoLocalizations`, {headers: H})).json();
              for (const loc of (locs.data || [])) {
                if (loc.attributes.locale === 'en-US' && loc.attributes.name !== 'Pairstorm') {
                  const r = await fetch(`${API}/appInfoLocalizations/${loc.id}`, {
                    method: 'PATCH', headers: H,
                    body: JSON.stringify({data: {id: loc.id, type: 'appInfoLocalizations',
                      attributes: {name: 'Pairstorm'}}})});
                  console.log('ASC name ->', 'Pairstorm', 'status', r.status);
                } else if (loc.attributes.locale === 'en-US') {
                  console.log('ASC name already Pairstorm');
                }
              }
            }
          })().catch(e => { console.log('name fix error (non-fatal):', e.message); });
          NODE
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up keychain / code signing
        script: |
          # Uses APP_STORE_CONNECT_* + CERTIFICATE_PRIVATE_KEY from the env group.
          # Docs: https://docs.codemagic.io/yaml-code-signing/signing-ios/
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          # App Store rejects a repeat of build 12. A UTC stamp is always higher.
          BUILD_NUM="$(date -u +%Y%m%d%H%M)"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --archive-directory "$CM_BUILD_DIR/build/ios/xcarchive" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUM"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - zach@seenlow.com
        notify:
          success: true
          failure: true

  ios-unsigned-check:
    name: Pairstorm iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.connectclash.app"
    scripts:
      - name: Install & sync
        script: |
          npm ci || npm install
          npx cap sync ios
          cd ios/App && pod install
      - name: xcodebuild (no codesign)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
