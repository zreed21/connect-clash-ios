# Codemagic CI — iOS archive + TestFlight for Connect Clash
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# Required Codemagic / App Store Connect secrets (add in UI → Environment variables
# or a variable group named "appstore_credentials"):
#
#   APP_STORE_CONNECT_ISSUER_ID   — App Store Connect → Users → Keys → Issuer ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER — Key ID for the .p8 API key
#   APP_STORE_CONNECT_PRIVATE_KEY   — Full contents of AuthKey_XXXXXX.p8
#   CERTIFICATE_PRIVATE_KEY        — RSA private key used to create/fetch distribution cert
#                                   (Codemagic code signing: openssl genrsa -out cert_key 2048)
#
# Optional:
#   APPLE_TEAM_ID                  — 10-char Team ID (also set below as placeholder)
#   APPLE_ID / APP_SPECIFIC_PASSWORD — only if not using API key publishing
#
# Bundle ID must match App Store Connect: com.connectclash.app

workflows:
  ios-testflight:
    name: Connect Clash iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Create an App Store Connect integration in Codemagic and rename if needed
      app_store_connect: ConnectClash
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.connectclash.app"
        APP_STORE_APPLE_ID: "0000000000"  # TODO: replace with numeric App Store Connect app id after first create
        # Team ID placeholder — override via Codemagic env or integration
        APPLE_TEAM_ID: "XXXXXXXXXX"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up keychain / code signing (Codemagic)
        script: |
          # Uses Codemagic's automatic code signing with App Store Connect API key.
          # See: https://docs.codemagic.io/code-signing-yaml/signing-ios/
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type ios_app_store \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        # Prefer Codemagic integration above; API key auth also works via env:
        # auth: integration  (when integrations.app_store_connect is set)
        #
        # Or explicit API key (uncomment + set secrets):
        # api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        # key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        # issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # submit_to_app_store: false
      email:
        recipients:
          - you@example.com  # TODO: your email
        notify:
          success: true
          failure: true

  # Local-style debug archive without publishing (optional)
  ios-unsigned-check:
    name: Connect Clash iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.connectclash.app"
    scripts:
      - name: Install & sync
        script: |
          npm ci || npm install
          npx cap sync ios
          cd ios/App && pod install
      - name: xcodebuild (no codesign)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
